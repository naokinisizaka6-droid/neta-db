name: Classify Videos with LLM

on:
  schedule:
    # 毎日 09:00 UTC (日本時間 18:00) に実行（collect.py の後）
    - cron: '0 9 * * *'
  workflow_dispatch:

jobs:
  classify:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r batch/requirements.txt

      - name: Run LLM classification
        env:
          CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python batch/classify.py

      - name: Log completion
        if: success()
        run: echo "✅ LLM classification completed successfully"

      - name: Notify on failure
        if: failure()
        run: |
          echo "❌ LLM classification failed"
          exit 1
