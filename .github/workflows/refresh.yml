name: Refresh & Cleanup

on:
  schedule:
    # 毎日 23:00 UTC (日本時間 翌日08:00) に実行
    - cron: '0 23 * * *'
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r batch/requirements.txt

      - name: Run video refresh and cleanup
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python batch/refresh.py

      - name: Log completion
        if: success()
        run: echo "✅ Refresh and cleanup completed successfully"

      - name: Notify on failure
        if: failure()
        run: |
          echo "❌ Refresh and cleanup failed"
          exit 1
